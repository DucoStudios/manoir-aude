name: Skrapa evenemangskalender

on:
  schedule:
    # En gång per dygn, 05:00 UTC.
    - cron: "0 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scrape-events
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Kör skrapare
        run: node scripts/scrape-events.mjs

      - name: Committa och pusha om något ändrats
        run: |
          git config user.name "manoir-aude-bot"
          git config user.email "actions@users.noreply.github.com"
          git add events.json
          if git diff --cached --quiet; then
            echo "Inga förändringar i evenemangskalendern."
          else
            git commit -m "Uppdatera evenemangskalendern $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
